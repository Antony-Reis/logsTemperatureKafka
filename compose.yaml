services:
  mongodb:
    image: 'mongo:latest'
    restart: on-failure
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - logsTemperature

  postgres:
    image: "postgres:16-alpine"
    container_name: "logsTemperaturePostgres"
    restart: on-failure
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - logsTemperature
volumes:
  mongodb_data:
    driver: local
  postgresql_data:
    driver: local

networks:
  logsTemperature:
    driver: bridge